<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Para um Amigo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fff8f0;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    h1 {
      margin-top: 20px;
      color: #4a90e2;
    }

    #imagem {
      width: 80%;
      max-width: 350px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      margin: 30px auto 10px;
      display: block;
      user-select: none;
    }

    .message-container {
      margin-top: 10px;
      max-width: 90%;
      margin-left: auto;
      margin-right: auto;
      background: #f0f7ff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      font-size: 1.3em;
      color: #333;
      user-select: none;
    }

    .arrow-btn {
      font-size: 2em;
      cursor: pointer;
      margin: 15px 10px 30px;
      user-select: none;
      color: #4a90e2;
      display: inline-block;
    }
  </style>
</head>
<body>

  <h1>Para um Amigo</h1>

  <img id="imagem" src="foto1.jpg" alt="Foto" />

  <div class="message-container">
    <div id="texto">Passe para o lado</div>
    <div>
      <span class="arrow-btn" onclick="changeImage(-1)">⬅️</span>
      <span class="arrow-btn" onclick="changeImage(1)">➡️</span>
    </div>
  </div>

  <audio id="musica" src="musica.mp3" loop></audio>

  <script>
    const audio = document.getElementById('musica');
    const imagem = document.getElementById('imagem');

    const imagens = [
      "foto1.jpg",
      "foto2.jpg"
    ];

    let currentIndex = 0;

    function changeImage(direction) {
      console.log("Seta clicada. Tentando tocar áudio...");
      if (audio.paused) {
        audio.play().then(() => {
          console.log("Áudio iniciado com sucesso.");
        }).catch((e) => {
          console.error("Erro ao tocar áudio:", e);
          alert("Não foi possível tocar o áudio automaticamente. Tente tocar manualmente.");
        });
      }
      currentIndex = (currentIndex + direction + imagens.length) % imagens.length;
      imagem.src = imagens[currentIndex];
    }
  </script>
</body>
</html>
